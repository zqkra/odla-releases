name: Bug report
description: Something in Odla does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Odla. A short, precise report is the fastest way to a fix.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from opening Odla.
      placeholder: |
        1. Open a chat with Claude Code
        2. Open the Files panel
        3. Click a PDF
    validations:
      required: true
  - type: input
    id: odla-version
    attributes:
      label: Odla version
      description: Odla > About Odla
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Pro M3"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      options:
        - None
        - Claude Code
        - Codex
        - Pi
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Drag screenshots here. Logs live in `~/.odla/logs`; attach the newest file if the problem is not visual.
